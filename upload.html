<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebToon Viewer 2000 - 작가 업로드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a246a'/%3E%3Crect x='2' y='2' width='12' height='12' fill='%23a6caf0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="win-window">
  <div class="title-bar">
    <div class="title-bar-text">
      <span class="title-bar-icon">W</span>
      WebToon Viewer 2000 - 작가 업로드
    </div>
    <div class="title-bar-controls">
      <span>_</span><span>&#9633;</span><span>&#10005;</span>
    </div>
  </div>

  <nav class="menu-bar">
    <a href="index.html">홈</a>
    <a href="index.html#genre">장르</a>
    <a href="upload.html" class="active">작가 업로드</a>
  </nav>

  <div class="window-content">
    <div class="notice" id="storage-notice">
      확인 중...
    </div>

    <fieldset>
      <legend>신규 작품 등록</legend>
      <form id="series-form">
        <label class="field-label" for="s-title">작품명 *</label>
        <input type="text" id="s-title" required maxlength="40">

        <label class="field-label" for="s-author">작가명 *</label>
        <input type="text" id="s-author" required maxlength="20">

        <label class="field-label">장르 (1개 이상 선택) *</label>
        <div id="s-genres" class="checkbox-row"></div>

        <label class="field-label" for="s-status">연재 상태</label>
        <select id="s-status">
          <option value="연재중">연재중</option>
          <option value="완결">완결</option>
        </select>

        <label class="field-label" for="s-desc">소개</label>
        <textarea id="s-desc" maxlength="200" placeholder="작품 소개를 입력하세요"></textarea>

        <p class="hint">표지 이미지 대신 대표 색상으로 썸네일이 자동 생성됩니다.</p>

        <div class="form-actions">
          <button type="submit" class="btn primary">작품 등록</button>
        </div>
        <div id="series-result"></div>
      </form>
    </fieldset>

    <fieldset>
      <legend>회차 추가</legend>
      <form id="episode-form">
        <label class="field-label" for="e-series">작품 선택 *</label>
        <select id="e-series"></select>

        <label class="field-label" for="e-title">회차 제목 *</label>
        <input type="text" id="e-title" required maxlength="40" placeholder="예: 5화. 새로운 시작">

        <label class="field-label" for="e-date">등록일</label>
        <input type="date" id="e-date">

        <label class="field-label" for="e-image">웹툰 이미지 (세로로 긴 PNG/JPG, 선택)</label>
        <input type="file" id="e-image" accept="image/png,image/jpeg,image/webp">
        <p class="hint" id="e-image-hint">이미지를 올리면 회차 뷰어에 그 이미지가 그대로 세로 스크롤로 표시됩니다. 최대 10MB.</p>

        <label class="field-label" for="e-panels">컷(패널) 수 (이미지를 안 올릴 때만 사용)</label>
        <input type="text" inputmode="numeric" id="e-panels" value="5" maxlength="2">
        <p class="hint">이미지를 올리지 않으면, 지정한 개수만큼 자리표시 패널(색상 블록)이 대신 표시됩니다.</p>

        <div class="form-actions">
          <button type="submit" class="btn primary">회차 등록</button>
        </div>
        <div id="episode-result"></div>
      </form>
    </fieldset>
  </div>

  <div class="status-bar">
    <span>작가 업로드</span>
    <span>WebToon Viewer 2000</span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cloudinary-config.js"></script>
<script src="js/data.js"></script>
<script src="js/upload.js"></script>
</body>
</html>
